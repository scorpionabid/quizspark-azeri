    <!-- Stale service worker cleanup: köhnə SW və precache-ləri dərhal sil -->
    <script>
      (function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            if (registrations && registrations.length > 0) {
              var unregisters = registrations.map(function (reg) {
                return reg.unregister();
              });
              var cacheDeletions = ('caches' in window)
                ? caches.keys().then(function (names) {
                    return Promise.all(names.map(function (name) { return caches.delete(name); }));
                  })
                : Promise.resolve();

              Promise.all([Promise.all(unregisters), cacheDeletions]).then(function () {
                if (!sessionStorage.getItem('sw_purged_v3')) {
                  sessionStorage.setItem('sw_purged_v3', '1');
                  window.location.reload();
                }
              });
            }
          });
        }
      })();
    </script>
