<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="620" height="320" rx="20" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5" />
  
  <text x="310" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Kağızın Qatlanması və Deşilməsi Ardıcıllığı</text>
  
  <!-- Step 1: Initial square -->
  <g transform="translate(40, 75)">
    <rect width="110" height="110" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)" />
    <line x1="55" y1="0" x2="55" y2="110" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Fold arrow -->
    <path d="M 30 55 Q 55 30 75 55" fill="none" stroke="#2563eb" stroke-width="2.5" />
    <polygon points="75,55 68,48 70,58" fill="#2563eb" />
    <text x="55" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">1. Soldan sağa</text>
  </g>
  
  <!-- Arrow 1 -> 2 -->
  <path d="M 175 130 L 205 130" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />
  <polygon points="205,130 197,125 197,135" fill="#94a3b8" />
  
  <!-- Step 2: Half folded -->
  <g transform="translate(225, 75)">
    <rect width="55" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)" />
    <line x1="0" y1="55" x2="55" y2="55" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Fold arrow top to bottom -->
    <path d="M 27.5 30 Q 45 55 27.5 75" fill="none" stroke="#2563eb" stroke-width="2.5" />
    <polygon points="27.5,75 32,67 22,67" fill="#2563eb" />
    <text x="27.5" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">2. Yuxarıdan aşağı</text>
  </g>
  
  <!-- Arrow 2 -> 3 -->
  <polygon points="315,130 307,125 307,135" fill="#94a3b8" />
  
  <!-- Step 3: 4-layer square with punch hole -->
  <g transform="translate(335, 102)">
    <rect width="55" height="55" rx="4" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3" filter="url(#shadow)" />
    <!-- Layers indicator -->
    <rect x="-4" y="-4" width="55" height="55" rx="4" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Punch hole -->
    <circle cx="27.5" cy="27.5" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="27.5" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">3. Mərkəzdən 1 dəlik</text>
    <text x="27.5" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">(4 qat kağız)</text>
  </g>
  
  <!-- Arrow 3 -> Result -->
  <polygon points="425,130 417,125 417,135" fill="#94a3b8" />
  
  <!-- Step 4: Full opened result prompt -->
  <g transform="translate(445, 75)">
    <rect width="110" height="110" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,6" filter="url(#shadow)" />
    <text x="55" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#dc2626">?</text>
    <text x="55" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">Tam açıldıqda = ?</text>
  </g>

  <!-- Bottom explanation note -->
  <rect x="110" y="265" width="400" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1" />
  <text x="310" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">
    Kvadrat 4 qat qatlanıb mərkəzdən deşildikdə cəmi neçə dəlik yaranar?
  </text>
</svg>