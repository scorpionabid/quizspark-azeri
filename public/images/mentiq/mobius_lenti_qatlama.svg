<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="stripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect x="10" y="10" width="660" height="380" rx="20" fill="url(#cardBg)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Badge / Title -->
  <g transform="translate(340, 42)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text text-anchor="middle" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">
      MÖBİUS LENTİ: 180° BURULMA VƏ TƏKÜZLÜLÜK
    </text>
  </g>

  <!-- Step 1: Flat strip -->
  <g transform="translate(50, 110)">
    <text x="80" y="-15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">1. Düzbucaqlı Kağız Zolaq</text>
    <rect x="0" y="0" width="160" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" />
    <!-- End indicators A and B -->
    <rect x="0" y="0" width="20" height="36" rx="4" fill="#38bdf8" />
    <text x="10" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1">A</text>
    <rect x="140" y="0" width="20" height="36" rx="4" fill="#818cf8" />
    <text x="150" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3">B</text>
    <text x="80" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">İki fərqli üzü var (Ön və Arxa)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(235, 125)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#94a3b8" stroke-width="2" />
    <polygon points="35,-4 43,0 35,4" fill="#94a3b8" />
    <text x="20" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#d97706">180° burulma</text>
  </g>

  <!-- Step 2: Möbius loop -->
  <g transform="translate(440, 210)">
    <text x="0" y="-115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4338ca">2. Ucların Birləşməsi (Möbius Lenti)</text>
    <!-- Möbius 3D parametric-like curves -->
    <!-- Back loop -->
    <path d="M -120,-30 C -120,-90 0,-90 40,-40 C 60,-15 70,30 20,60 C -30,90 -120,40 -120,-30 Z" fill="none" stroke="#cbd5e1" stroke-width="28" stroke-linecap="round" />
    <!-- Front loop with twist -->
    <path d="M -110,-25 C -100,-75 10,-80 50,-35 C 75,-7 85,35 30,65 C -20,95 -100,50 -110,-25" fill="none" stroke="url(#stripGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Red continuous line demonstrating single side -->
    <path d="M -100,-25 C -90,-70 10,-70 50,-35 C 70,-10 80,30 30,60 C -15,85 -90,45 -100,-25" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 4" />

    <!-- Central annotation -->
    <circle cx="-25" cy="5" r="20" fill="#ffffff" stroke="#ef4444" stroke-width="2" />
    <text x="-25" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#dc2626">1</text>
  </g>

  <!-- Summary Banner -->
  <g transform="translate(340, 345)">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2" />
    <text text-anchor="middle" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">
      Nəticə: Möbius lenti birmənalı olaraq yalnız 1 ÜZƏ və 1 KƏNARA malikdir!
    </text>
  </g>
</svg>