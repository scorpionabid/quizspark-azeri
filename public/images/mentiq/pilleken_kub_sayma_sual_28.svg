<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="560" height="360" rx="20" fill="url(#bgGrad5)" stroke="#e2e8f0" stroke-width="1.5" />
  
  <text x="280" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Pilləkən Şəkilli 3D Kub Bloku (Otaq Küncü)</text>

  <!-- 3D Room Corner Wall Lines -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4">
    <!-- Corner vertical line -->
    <line x1="80" y1="60" x2="80" y2="290" />
    <!-- Floor line right -->
    <line x1="80" y1="290" x2="500" y2="290" />
  </g>

  <!-- Isometric cube drawing function helper in SVG -->
  <!-- We have 5 columns from left to right:
       Col 1: 1 cube
       Col 2: 2 cubes
       Col 3: 3 cubes
       Col 4: 4 cubes
       Col 5: 5 cubes
       Cube width = 50, height = 35.
  -->
  <g transform="translate(110, 270)" filter="url(#shadow5)">
    <!-- Col 1 (1 cube): x=0 -->
    <g transform="translate(0, -35)">
      <rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" />
      <polygon points="0,0 15,-15 60,-15 45,0" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5" />
      <polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" />
    </g>
    <!-- Label Col 1 -->
    <text x="22" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">1</text>

    <!-- Col 2 (2 cubes): x=65 -->
    <g transform="translate(65, 0)">
      <!-- bottom cube -->
      <g transform="translate(0, -35)">
        <rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" />
        <polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" />
      </g>
      <!-- top cube -->
      <g transform="translate(0, -70)">
        <rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" />
        <polygon points="0,0 15,-15 60,-15 45,0" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5" />
        <polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" />
      </g>
      <text x="22" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">2</text>
    </g>

    <!-- Col 3 (3 cubes): x=130 -->
    <g transform="translate(130, 0)">
      <g transform="translate(0, -35)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <g transform="translate(0, -70)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <g transform="translate(0, -105)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="0,0 15,-15 60,-15 45,0" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <text x="22" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">3</text>
    </g>

    <!-- Col 4 (4 cubes): x=195 -->
    <g transform="translate(195, 0)">
      <g transform="translate(0, -35)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <g transform="translate(0, -70)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <g transform="translate(0, -105)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <g transform="translate(0, -140)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="0,0 15,-15 60,-15 45,0" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <text x="22" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">4</text>
    </g>

    <!-- Col 5 (5 cubes): x=260 -->
    <g transform="translate(260, 0)">
      <g transform="translate(0, -35)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <g transform="translate(0, -70)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <g transform="translate(0, -105)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <g transform="translate(0, -140)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <g transform="translate(0, -175)"><rect width="45" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="0,0 15,-15 60,-15 45,0" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5" /><polygon points="45,0 60,-15 60,20 45,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5" /></g>
      <text x="22" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">5</text>
    </g>
  </g>

  <!-- Total Prompt Box -->
  <rect x="130" y="310" width="300" height="34" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text x="280" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e40af">
    Cəmi kubların sayı = 1 + 2 + 3 + 4 + 5 = ?
  </text>
</svg>