<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="460" height="360" rx="20" fill="url(#bgGrad3)" stroke="#e2e8f0" stroke-width="1.5" />
  
  <text x="230" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Dairəvi Sektorlar Qanunauyğunluğu</text>
  
  <!-- Outer Wheel: Center = (230, 185), R = 110 -->
  <g transform="translate(230, 185)" filter="url(#shadow3)">
    <!-- 4 Sectors -->
    <!-- Top-Left (180 to 270) -->
    <path d="M 0 0 L -110 0 A 110 110 0 0 1 0 -110 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
    <!-- Top-Right (270 to 360) -->
    <path d="M 0 0 L 0 -110 A 110 110 0 0 1 110 0 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" />
    <!-- Bottom-Right (0 to 90) -->
    <path d="M 0 0 L 110 0 A 110 110 0 0 1 0 110 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
    <!-- Bottom-Left (90 to 180) -->
    <path d="M 0 0 L 0 110 A 110 110 0 0 1 -110 0 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" />

    <!-- Sector 1: Top-Left: 3 -->
    <circle cx="-50" cy="-50" r="24" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <text x="-50" y="-42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#1d4ed8">3</text>

    <!-- Sector 2: Top-Right: 7 -->
    <circle cx="50" cy="-50" r="24" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <text x="50" y="-42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#1d4ed8">7</text>

    <!-- Sector 3: Bottom-Right: 15 -->
    <circle cx="50" cy="50" r="24" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <text x="50" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#1d4ed8">15</text>

    <!-- Sector 4: Bottom-Left: ? -->
    <circle cx="-50" cy="50" r="26" fill="#ffffff" stroke="#dc2626" stroke-width="2.5" />
    <text x="-50" y="59" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#dc2626">?</text>

    <!-- Center Pivot -->
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Clockwise indicator arc -->
  <path d="M 360 185 A 130 130 0 0 1 230 315" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5,4" />
  <polygon points="230,315 238,310 238,320" fill="#3b82f6" />
  <text x="340" y="280" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3b82f6">Saat əqrəbi üzrə</text>

  <!-- Bottom Tip -->
  <text x="230" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">
    Qanunauyğunluğu taparaq sual işarəsinin yerinə uyğun ədədi seçin
  </text>
</svg>