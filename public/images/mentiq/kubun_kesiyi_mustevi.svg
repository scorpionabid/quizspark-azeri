<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2" />
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect x="10" y="10" width="660" height="390" rx="20" fill="url(#cardBg)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Badge / Title -->
  <g transform="translate(340, 40)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text text-anchor="middle" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">
      KUBUN MÜSTƏVİ İLƏ KƏSİYİ (Maksimum 6-bucaqlı)
    </text>
  </g>

  <!-- Left: 3D Cube with Cutting Plane -->
  <g transform="translate(180, 210)">
    <text x="0" y="-115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0369a1">Fəzada Kəsik Müstəvisi</text>
    <!-- Hidden back edges of cube -->
    <line x1="-70" y1="30" x2="10" y2="-30" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="10" y1="-30" x2="110" y2="-30" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="10" y1="-30" x2="10" y2="-110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Cutting Plane Section (Hexagon cut inside cube) -->
    <polygon points="-70,-10 -30,-80 50,-90 95,-10 60,60 -20,60" fill="url(#planeGrad)" stroke="#dc2626" stroke-width="2.5" />

    <!-- Front visible edges of cube -->
    <line x1="-70" y1="-50" x2="30" y2="-50" stroke="#334155" stroke-width="2" />
    <line x1="30" y1="-50" x2="110" y2="-110" stroke="#334155" stroke-width="2" />
    <line x1="-70" y1="-50" x2="10" y2="-110" stroke="#334155" stroke-width="2" />
    <line x1="-70" y1="-50" x2="-70" y2="30" stroke="#334155" stroke-width="2" />
    <line x1="30" y1="-50" x2="30" y2="30" stroke="#334155" stroke-width="2" />
    <line x1="110" y1="-110" x2="110" y2="-30" stroke="#334155" stroke-width="2" />
    <line x1="-70" y1="30" x2="30" y2="30" stroke="#334155" stroke-width="2" />
    <line x1="30" y1="30" x2="110" y2="-30" stroke="#334155" stroke-width="2" />

    <text x="10" y="-15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Kəsik (Max 6 üz)</text>
  </g>

  <!-- Right: Possible vs Impossible Section Shapes -->
  <g transform="translate(490, 95)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Kəsikdə Alına Bilən Fiqurlar:</text>

    <!-- Row 1: Triangle (3-bucaqlı) -->
    <g transform="translate(-100, 30)">
      <circle cx="0" cy="0" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">✓</text>
      <text x="20" y="4" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Üçbucaq (3 üz kəsiləndə)</text>
    </g>

    <!-- Row 2: Quadrilateral (4-bucaqlı) -->
    <g transform="translate(-100, 65)">
      <circle cx="0" cy="0" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">✓</text>
      <text x="20" y="4" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Dördbucaqlı (Kvadrat/Romb/Trapesiya)</text>
    </g>

    <!-- Row 3: Pentagon & Hexagon -->
    <g transform="translate(-100, 100)">
      <circle cx="0" cy="0" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">✓</text>
      <text x="20" y="4" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Beşbucaqlı və Altıbucaqlı (5-6 üz)</text>
    </g>

    <!-- Row 4: IMPOSSIBLE (8-bucaqlı) -->
    <g transform="translate(-100, 145)">
      <rect x="-10" y="-16" width="250" height="44" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
      <circle cx="10" cy="6" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
      <text x="10" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">✕</text>
      <text x="32" y="2" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Düzgün Səkkizbucaqlı</text>
      <text x="32" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c">Kubun cəmi 6 üzü olduğu üçün QEYRİ-MÜMKÜNDÜR</text>
    </g>
  </g>

  <!-- Bottom rule -->
  <g transform="translate(340, 355)">
    <rect x="-250" y="-14" width="500" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">
      Qayda: Müstəvi hBcüzlü çoxüzlünü ən çox hBcbucaqlı kəsiklə kəsə bilər (Kub üçün max 6).
    </text>
  </g>
</svg>