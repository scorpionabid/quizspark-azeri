<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect x="10" y="10" width="660" height="390" rx="20" fill="url(#cardBg)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Badge / Title -->
  <g transform="translate(340, 42)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text text-anchor="middle" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">
      DÜZGÜN ÇOXBUCAQLILARIN SİMMETRİYA OXLARI
    </text>
  </g>

  <!-- Left: Regular Octagon (n = 8) with 8 axes of symmetry -->
  <g transform="translate(190, 215)">
    <text x="0" y="-115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0284c7">Düzgün Səkkizbucaqlı (n = 8)</text>
    <polygon points="34.4,-83.1 83.1,-34.4 83.1,34.4 34.4,83.1 -34.4,83.1 -83.1,34.4 -83.1,-34.4 -34.4,-83.1" fill="url(#polyGrad)" stroke="#0284c7" stroke-width="2.5" />
    <line x1="40.2" y1="-97.0" x2="-40.2" y2="97.0" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="97.0" y1="-40.2" x2="-97.0" y2="40.2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="97.0" y1="40.2" x2="-97.0" y2="-40.2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="40.2" y1="97.0" x2="-40.2" y2="-97.0" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="0.0" y1="-105.0" x2="-0.0" y2="105.0" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="74.2" y1="-74.2" x2="-74.2" y2="74.2" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="105.0" y1="0.0" x2="-105.0" y2="-0.0" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="74.2" y1="74.2" x2="-74.2" y2="-74.2" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="0" cy="0" r="4" fill="#ef4444" />
    <text x="0" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Cəmi 8 simmetriya oxu</text>
  </g>

  <!-- Right: Regular Dodecagon (n = 12) with 12 axes of symmetry -->
  <g transform="translate(490, 215)">
    <text x="0" y="-115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4f46e5">Düzgün Onikibucaqlı (n = 12)</text>
    <polygon points="0.0,-90.0 45.0,-77.9 77.9,-45.0 90.0,0.0 77.9,45.0 45.0,77.9 0.0,90.0 -45.0,77.9 -77.9,45.0 -90.0,0.0 -77.9,-45.0 -45.0,-77.9" fill="url(#polyGrad)" stroke="#4f46e5" stroke-width="2.5" />
    <line x1="0.0" y1="-105.0" x2="-0.0" y2="105.0" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="52.5" y1="-90.9" x2="-52.5" y2="90.9" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="90.9" y1="-52.5" x2="-90.9" y2="52.5" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="105.0" y1="0.0" x2="-105.0" y2="-0.0" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="90.9" y1="52.5" x2="-90.9" y2="-52.5" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="52.5" y1="90.9" x2="-52.5" y2="-90.9" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="27.2" y1="-101.4" x2="-27.2" y2="101.4" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="74.2" y1="-74.2" x2="-74.2" y2="74.2" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="101.4" y1="-27.2" x2="-101.4" y2="27.2" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="101.4" y1="27.2" x2="-101.4" y2="-27.2" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="74.2" y1="74.2" x2="-74.2" y2="-74.2" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 3" />
    <line x1="27.2" y1="101.4" x2="-27.2" y2="-101.4" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 3" />
    <circle cx="0" cy="0" r="4" fill="#4f46e5" />
    <text x="0" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4338ca">Cəmi 12 simmetriya oxu</text>
  </g>

  <!-- Bottom Golden Rule -->
  <g transform="translate(340, 360)">
    <rect x="-250" y="-14" width="500" height="28" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">
      Qızıl Qayda: İstənilən düzgün n-bucaqlının dəqiq n sayda simmetriya oxu vardır!
    </text>
  </g>
</svg>