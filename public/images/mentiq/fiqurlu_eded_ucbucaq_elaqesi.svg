<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="600" height="320" rx="20" fill="url(#bgGrad4)" stroke="#e2e8f0" stroke-width="1.5" />
  
  <text x="300" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Fiqurlu Ədəd Əlaqəsi (Üçbucağın Elementləri)</text>

  <!-- Triangle 1: (2, 3, 4) -> 25 -->
  <g transform="translate(30, 65)">
    <polygon points="80,30 150,150 10,150" fill="#eff6ff" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round" filter="url(#shadow4)" />
    <!-- Vertices -->
    <circle cx="80" cy="30" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">2</text>
    
    <circle cx="10" cy="150" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="10" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">3</text>
    
    <circle cx="150" cy="150" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="150" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">4</text>
    
    <!-- Center Number -->
    <rect x="55" y="90" width="50" height="32" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <text x="80" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#1d4ed8">25</text>
  </g>

  <!-- Triangle 2: (3, 4, 5) -> 61 -->
  <g transform="translate(220, 65)">
    <polygon points="80,30 150,150 10,150" fill="#eff6ff" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round" filter="url(#shadow4)" />
    <!-- Vertices -->
    <circle cx="80" cy="30" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">3</text>
    
    <circle cx="10" cy="150" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="10" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">4</text>
    
    <circle cx="150" cy="150" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="150" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">5</text>
    
    <!-- Center Number -->
    <rect x="55" y="90" width="50" height="32" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <text x="80" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#1d4ed8">61</text>
  </g>

  <!-- Triangle 3: (1, 5, 6) -> ? -->
  <g transform="translate(410, 65)">
    <polygon points="80,30 150,150 10,150" fill="#fee2e2" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" filter="url(#shadow4)" />
    <!-- Vertices -->
    <circle cx="80" cy="30" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#b91c1c">1</text>
    
    <circle cx="10" cy="150" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <text x="10" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#b91c1c">5</text>
    
    <circle cx="150" cy="150" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <text x="150" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#b91c1c">6</text>
    
    <!-- Center Number: ? -->
    <rect x="55" y="90" width="50" height="32" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5" />
    <text x="80" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#dc2626">?</text>
  </g>

  <!-- Bottom Tip -->
  <rect x="100" y="255" width="400" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" />
  <text x="300" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">
    Təpə nöqtələri ilə mərkəz arasındakı məntiqə əsasən ? ədədini tapın
  </text>
</svg>