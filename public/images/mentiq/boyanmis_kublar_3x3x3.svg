<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect x="10" y="10" width="660" height="410" rx="20" fill="url(#cardBg)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Title Badge -->
  <g transform="translate(340, 42)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text text-anchor="middle" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">
      BOYANMIŞ KUBLAR: 3 × 3 × 3 = 27 MODELİ
    </text>
  </g>

  <!-- Left: 3D Isometric 3x3x3 Cube -->
  <g transform="translate(180, 230)">
    <!-- Isometric projection: dx = 32, dy = 18, dz = 36 -->
    <polygon points="102,57 102,19 68,38 68,76" fill="#dc2626" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="68,76 68,38 34,57 34,95" fill="#2563eb" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-102,57 -68,76 -68,38 -102,19" fill="#ef4444" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-68,76 -34,95 -34,57 -68,38" fill="#3b82f6" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="34,95 34,57 0,76 0,114" fill="#dc2626" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-34,95 0,114 0,76 -34,57" fill="#ef4444" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="102,19 102,-19 68,0 68,38" fill="#2563eb" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="68,38 68,0 34,19 34,57" fill="#16a34a" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-102,19 -68,38 -68,0 -102,-19" fill="#3b82f6" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-68,38 -34,57 -34,19 -68,0" fill="#22c55e" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="34,57 34,19 0,38 0,76" fill="#2563eb" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-34,57 0,76 0,38 -34,19" fill="#3b82f6" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="0,-114 34,-95 0,-76 -34,-95" fill="#f87171" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="34,-95 68,-76 34,-57 0,-76" fill="#60a5fa" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="68,-76 102,-57 68,-38 34,-57" fill="#f87171" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="102,-19 102,-57 68,-38 68,0" fill="#dc2626" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-34,-95 0,-76 -34,-57 -68,-76" fill="#60a5fa" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="0,-76 34,-57 0,-38 -34,-57" fill="#4ade80" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="34,-57 68,-38 34,-19 0,-38" fill="#60a5fa" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="68,0 68,-38 34,-19 34,19" fill="#2563eb" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-68,-76 -34,-57 -68,-38 -102,-57" fill="#f87171" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-102,-19 -68,0 -68,-38 -102,-57" fill="#ef4444" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-34,-57 0,-38 -34,-19 -68,-38" fill="#60a5fa" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-68,0 -34,19 -34,-19 -68,-38" fill="#3b82f6" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="0,-38 34,-19 0,0 -34,-19" fill="#f87171" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="34,19 34,-19 0,0 0,38" fill="#dc2626" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="-34,19 0,38 0,0 -34,-19" fill="#ef4444" stroke="#1e293b" stroke-width="1.2" />
  </g>

  <!-- Right: Legend / Explanations -->
  <g transform="translate(490, 100)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Kubcuqların Təsnifatı:</text>

    <!-- Item 1: 3 üzü boyalı -->
    <g transform="translate(-115, 20)">
      <rect x="0" y="0" width="240" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
      <circle cx="18" cy="25" r="8" fill="#ef4444" />
      <text x="34" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">3 Üzü Boyalı: 8 ədəd</text>
      <text x="34" y="37" font-family="system-ui, sans-serif" font-size="11" fill="#ef4444">Yalnız təpə künclərindəki kublar</text>
    </g>

    <!-- Item 2: 2 üzü boyalı -->
    <g transform="translate(-115, 80)">
      <rect x="0" y="0" width="240" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <circle cx="18" cy="25" r="8" fill="#3b82f6" />
      <text x="34" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">2 Üzü Boyalı: 12 ədəd</text>
      <text x="34" y="37" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb">Tillərin ortasında: 12 × (n - 2)</text>
    </g>

    <!-- Item 3: 1 üzü boyalı -->
    <g transform="translate(-115, 140)">
      <rect x="0" y="0" width="240" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
      <circle cx="18" cy="25" r="8" fill="#22c55e" />
      <text x="34" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">1 Üzü Boyalı: 6 ədəd</text>
      <text x="34" y="37" font-family="system-ui, sans-serif" font-size="11" fill="#16a34a">Üzlərin mərkəzində: 6 × (n - 2)²</text>
    </g>

    <!-- Item 4: 0 üzü boyalı -->
    <g transform="translate(-115, 200)">
      <rect x="0" y="0" width="240" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="18" cy="25" r="8" fill="#64748b" />
      <text x="34" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">0 Üzü Boyalı (Daxili): 1 ədəd</text>
      <text x="34" y="37" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Tam mərkəzdə: (n - 2)³ = 1³ = 1</text>
    </g>
  </g>

  <!-- Bottom Formula Banner -->
  <g transform="translate(340, 375)">
    <rect x="-250" y="-14" width="500" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">
      Cəmi: 8 (3-üz) + 12 (2-üz) + 6 (1-üz) + 1 (0-üz) = 27 Kubcuq
    </text>
  </g>
</svg>